<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITCH | Reset password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#181818;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:520px;margin:8vh auto;padding:20px}.box{background:white;border:1px solid #e9e9e5;border-radius:24px;padding:34px;box-shadow:0 12px 35px #00000007}.brand{font-size:19px;font-weight:900;letter-spacing:1px;color:#f66a22}h1{font-size:30px;margin:22px 0 10px}p{color:#606060;line-height:1.55}label{display:block;font-weight:750;font-size:12px;margin:20px 0 8px}input{border:1px solid #d8d8d3;border-radius:10px;width:100%;padding:14px;font-size:16px}button{border:0;border-radius:10px;background:#151515;color:#fff;width:100%;padding:15px;font-weight:800;font-size:15px;margin-top:20px;cursor:pointer}button:disabled{opacity:.55}.message{color:#87460f;margin-top:18px;line-height:1.6;white-space:pre-line}.hidden{display:none}a{color:#ed6120}</style></head><body><div class="wrap"><div class="box"><div class="brand">KITCH</div><div id="request"><h1>Forgot your password?</h1><p>Enter your KITCH account email. We'll send a secure password reset link if the address is registered.</p><label>ACCOUNT EMAIL</label><input id="email" type="email" autocomplete="email"><button id="requestBtn">Send reset link</button></div><div id="update" class="hidden"><h1>Choose a new password</h1><p>Set a new password for your KITCH management account.</p><label>NEW PASSWORD</label><input id="newPassword" type="password" minlength="10" autocomplete="new-password"><label>CONFIRM PASSWORD</label><input id="confirmPassword" type="password" minlength="10" autocomplete="new-password"><button id="updateBtn">Update password</button></div><p id="message" class="message" role="status" aria-live="polite"></p><p><a href="https://kitch.ae/">Back to KITCH</a></p></div></div><script>
const client=window.supabase.createClient('https://rtovpjgrezwxuvantxgt.supabase.co','sb_publishable_ERMt86IhOTqRSRXE05CQ-A_JXi27ode',{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),note=s=>$('message').textContent=s;
function showUpdate(){ $('request').classList.add('hidden');$('update').classList.remove('hidden'); note('Your recovery link is verified. Choose a new password.'); }
async function detectRecovery(){
 const hash=new URLSearchParams(location.hash.substring(1)),query=new URLSearchParams(location.search);
 const type=hash.get('type')||query.get('type');
 const error=hash.get('error_description')||query.get('error_description');
 if(error){note(decodeURIComponent(error.replace(/\+/g,' ')));return;}
 if(type==='recovery'||hash.get('access_token')||query.get('code')){
  const {data:{session}}=await client.auth.getSession();
  if(session){showUpdate();return;}
  note('Recovery link could not be validated. Request another link.');
 }
}
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showUpdate();});
$('requestBtn').onclick=async()=>{const em=$('email').value.trim().toLowerCase();if(!em||!em.includes('@'))return note('Enter a valid account email.');$('requestBtn').disabled=true;try{const {error}=await client.auth.resetPasswordForEmail(em,{redirectTo:'https://kitch.ae/reset-password.html'});if(error)throw error;note('If this email is registered, a password reset link has been sent. Check your inbox and spam folder.');}catch(e){note('Unable to send reset email: '+(e.message||String(e)));}finally{$('requestBtn').disabled=false;}};
$('updateBtn').onclick=async()=>{const password=$('newPassword').value,confirm=$('confirmPassword').value;if(password.length<10)return note('Use at least 10 characters.');if(password!==confirm)return note('Passwords do not match.');$('updateBtn').disabled=true;try{const {data:{user}}=await client.auth.getUser();if(!user)throw Error('Your recovery link has expired. Request a new one.');const {error}=await client.auth.updateUser({password});if(error)throw error;await client.auth.signOut();$('update').classList.add('hidden');$('request').classList.remove('hidden');note('Password updated. Return to KITCH and sign in with your new password.');}catch(e){note(e.message||String(e));}finally{$('updateBtn').disabled=false;}};
detectRecovery().catch(e=>note(e.message||String(e)));
</script></body></html>

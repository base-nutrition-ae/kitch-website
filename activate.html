<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITCH — Activate your restaurant</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f8f8f6;color:#151515;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:520px;margin:5vh auto;padding:22px}.box{padding:32px;border:1px solid #e9e9e5;border-radius:24px;background:white;box-shadow:0 10px 40px #00000009}h1{margin:8px 0 10px;font-size:29px}p{color:#666;line-height:1.5}.brand{color:#fa621b;font-weight:900;letter-spacing:2px}label{display:block;font-size:12px;font-weight:750;margin:18px 0 7px}input{width:100%;font-size:15px;padding:14px;border:1px solid #d8d8d3;border-radius:10px}button{width:100%;background:#171717;color:white;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:15px;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}.msg{margin-top:17px;line-height:1.6;color:#a54d11;white-space:pre-wrap}a{color:#e75b15}.hidden{display:none}.hint{background:#fff5eb;border-radius:10px;padding:12px;font-size:12px}</style></head><body><div class="wrap"><div class="box"><div class="brand">KITCH</div><h1>Activate your restaurant</h1><p>For customers who completed a Stripe test subscription but haven't received a restaurant workspace. You won't be charged again.</p><div id="sign"><label>ACCOUNT EMAIL</label><input type="email" id="email" autocomplete="username"><label>ACCOUNT PASSWORD</label><input type="password" id="password" autocomplete="current-password"><button id="signBtn">Sign in to your KITCH account</button></div><div class="hidden" id="activate"><div class="hint" id="planInfo"></div><label>RESTAURANT / COMPANY NAME</label><input id="company" maxlength="120" placeholder="Your restaurant's registered name"><label>FIRST BRANCH</label><input id="branch" maxlength="100" placeholder="Main Branch"><button id="activateBtn">Activate my existing subscription</button><button id="signoutBtn" style="background:#eee;color:#111">Use different account</button></div><p class="msg" id="message"></p><p><a href="/">Back to KITCH</a></p></div></div><script>
const sb=window.supabase.createClient('https://rtovpjgrezwxuvantxgt.supabase.co','sb_publishable_ERMt86IhOTqRSRXE05CQ-A_JXi27ode');
const $=id=>document.getElementById(id);
const msg=s=>$('message').textContent=s;
async function check(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){$('sign').classList.remove('hidden');$('activate').classList.add('hidden');return;}
 const {data:sub,error}=await sb.from('kitch_subscriptions').select('plan,status').eq('user_id',user.id).maybeSingle();
 if(error||!sub||!['active','trialing'].includes(sub.status)){msg('No verified active KITCH subscription found for this account. Do not make another payment. Contact KITCH support.');return;}
 const {data:workspace, error:we}=await sb.rpc('kitch_current_workspace');
 if(!we&&workspace&&((Array.isArray(workspace)&&workspace.length)||(!Array.isArray(workspace)&&workspace.restaurant_id))){msg('Your restaurant workspace is already connected. Open KITCH and sign in to Management.');$('sign').classList.add('hidden');return;}
 $('sign').classList.add('hidden');$('activate').classList.remove('hidden');
 $('planInfo').textContent='Verified '+String(sub.plan).toUpperCase()+' subscription · '+String(sub.status);
 const metadata=user.user_metadata||{};
 $('company').value=metadata.kitch_company||'';
 $('branch').value=metadata.kitch_branch||'';
 msg('Authenticated as '+user.email+'. Enter the company and first branch exactly as you want them displayed.');
}
$('signBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value; if(!email||!password)return msg('Enter your KITCH account email and password.'); $('signBtn').disabled=true;try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await check();}catch(e){msg(e.message||String(e));}finally{$('signBtn').disabled=false;}};
$('activateBtn').onclick=async()=>{const company=$('company').value.trim(),branch=$('branch').value.trim();if(company.length<2||branch.length<2)return msg('Enter restaurant and branch names (at least 2 characters).');$('activateBtn').disabled=true;try{const {data:sub,error:se}=await sb.from('kitch_subscriptions').select('plan,status').maybeSingle();if(se||!sub||!['active','trialing'].includes(sub.status))throw Error('Verified subscription not found.');const {error}=await sb.rpc('kitch_create_owner_workspace',{p_company:company,p_branch:branch,p_plan:sub.plan,p_operation:sub.plan==='business'?'multi':'restaurant'});if(error)throw error;msg('Workspace activated! Open KITCH and sign in with this account.');$('activate').classList.add('hidden');}catch(e){msg('Activation failed: '+(e.message||String(e)));}finally{$('activateBtn').disabled=false;}};
$('signoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};check().catch(e=>msg(e.message||String(e)));
</script></body></html>
